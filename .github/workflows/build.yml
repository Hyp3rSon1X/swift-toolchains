name: build

# Overlay release: rebuild patched components against the official Swift release, verify them,
# then (publish only) push images to GHCR and attach tarballs to a GitHub release.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release id (file releases/<id>.env); empty = newest"
        required: false
        default: ""
      publish:
        description: "Push images and create the GitHub release"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["releases/**", "overlays/**", "tests/**", "docker/**", ".github/workflows/build.yml"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: true

# Explicit bash = -eo pipefail, so `docker run ... | tee` fails when the test fails.
defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/hyp3rson1x/swift

jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      id: ${{ steps.r.outputs.id }}
      static: ${{ steps.r.outputs.static }}
      compiler: ${{ steps.r.outputs.compiler }}
    steps:
      - uses: actions/checkout@v7
      - id: r
        run: |
          id="${{ inputs.release }}"
          [ -n "$id" ] || id=$(ls releases/*.env | sed 's#releases/##; s#\.env$##' | sort -V | tail -1)
          [ -f "releases/$id.env" ] || { echo "::error::no releases/$id.env"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          # Non-empty when the release also ships a patched Static Linux SDK (jobs static-sdk*).
          echo "static=$(sed -n 's/^STATIC_SDK_VERSION=//p' "releases/$id.env")" >> "$GITHUB_OUTPUT"
          # Non-empty when the release ships a rebuilt swift-frontend (jobs compiler-*).
          echo "compiler=$(sed -n 's/^SWIFT_REF=//p' "releases/$id.env")" >> "$GITHUB_OUTPUT"
          cat "releases/$id.env"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Load manifest
        run: scripts/load-manifest.sh "${{ needs.meta.outputs.id }}"
      # An overlay is built and tested only when the manifest sets its *_REF (hyp3r.1 has no foundation).
      - uses: actions/checkout@v7
        if: env.LIBDISPATCH_REF != ''
        with:
          repository: ${{ env.LIBDISPATCH_REPO }}
          ref: ${{ env.LIBDISPATCH_REF }}
          path: src/libdispatch
      - name: Build libdispatch overlay
        if: env.LIBDISPATCH_REF != ''
        run: docker run --rm -v "$PWD:/w" -w /w "$BASE_IMAGE" bash overlays/libdispatch/build.sh /w/src/libdispatch /w/out
      - name: Test libdispatch (reproducer stock vs patched, SwiftPM smoke)
        if: env.LIBDISPATCH_REF != ''
        run: docker run --rm -v "$PWD:/w" -w /w "$BASE_IMAGE" bash tests/SC-0001-libdispatch-epollhup/run.sh /w/out | tee test-libdispatch.log
      - name: Test libdispatch (SC-0014 signal source after SIG_IGN)
        if: env.LIBDISPATCH_REF != ''
        run: docker run --rm -v "$PWD:/w" -w /w "$BASE_IMAGE" bash tests/SC-0014-libdispatch-signal-ign/run.sh /w/out | tee test-libdispatch-signal.log
      - uses: actions/checkout@v7
        if: env.FOUNDATION_REF != ''
        with:
          repository: ${{ env.FOUNDATION_REPO }}
          ref: ${{ env.FOUNDATION_REF }}
          path: src/foundation
      - name: Fetch Foundation dependencies at the release-pinned revisions
        if: env.FOUNDATION_REF != ''
        run: |
          set -euo pipefail
          mkdir -p src/deps
          git clone -q --depth 1 -b "$SWIFT_FOUNDATION_TAG"     https://github.com/swiftlang/swift-foundation.git     src/deps/swift-foundation
          git clone -q --depth 1 -b "$SWIFT_FOUNDATION_ICU_TAG" https://github.com/swiftlang/swift-foundation-icu.git src/deps/swift-foundation-icu
          git clone -q --depth 1 -b "$SWIFT_COLLECTIONS_TAG"    https://github.com/apple/swift-collections.git        src/deps/swift-collections
      - name: Build Foundation overlay
        if: env.FOUNDATION_REF != ''
        run: docker run --rm -v "$PWD:/w" -w /w "$BASE_IMAGE" bash overlays/foundation/build.sh /w/src/foundation /w/src/deps /w/out 2>&1 | tee build-foundation.log | grep -vE 'warning|^ *[0-9]+ \||^ *[|`]|^$' | tail -60
      - name: Test Foundation (Process under many open descriptors, stock vs patched, valgrind)
        if: env.FOUNDATION_REF != ''
        run: docker run --rm -v "$PWD:/w" -w /w "$BASE_IMAGE" bash tests/SC-0002-foundation-process/run.sh /w/out | tee test-foundation.log
      - name: Summary
        if: always()
        run: |
          { echo "### ${{ matrix.arch }}"; echo '```'; cat out/MANIFEST-*.txt 2>/dev/null; grep -hE '^(stock|patched|swift build|SUMMARY)' test-*.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: overlay-${{ matrix.arch }}
          path: out/
          retention-days: 3

  # Patched Static Linux SDK (musl): libdispatch.a and libFoundation.a rebuilt against the official bundle's sysroot.
  # static-sdk builds natively per arch, static-sdk-bundle assembles one bundle with both arches, static-sdk-test
  # installs official + patched bundle side by side and runs the SC-0001/SC-0002 reproducers statically linked.
  static-sdk:
    needs: meta
    if: needs.meta.outputs.static != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Load manifest
        run: scripts/load-manifest.sh "${{ needs.meta.outputs.id }}"
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.LIBDISPATCH_REPO }}
          ref: ${{ env.LIBDISPATCH_REF }}
          path: src/libdispatch
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.FOUNDATION_REPO }}
          ref: ${{ env.FOUNDATION_REF }}
          path: src/foundation
      - name: Fetch Foundation dependencies at the release-pinned revisions
        run: |
          set -euo pipefail
          mkdir -p src/deps
          git clone -q --depth 1 -b "$SWIFT_FOUNDATION_TAG"     https://github.com/swiftlang/swift-foundation.git     src/deps/swift-foundation
          git clone -q --depth 1 -b "$SWIFT_FOUNDATION_ICU_TAG" https://github.com/swiftlang/swift-foundation-icu.git src/deps/swift-foundation-icu
          git clone -q --depth 1 -b "$SWIFT_COLLECTIONS_TAG"    https://github.com/apple/swift-collections.git        src/deps/swift-collections
      - name: Official Static Linux SDK (checksum + signature verified)
        run: |
          set -euo pipefail
          mkdir -p dl sdk
          curl -fsSL -o dl/official.tar.gz     "$STATIC_SDK_URL"
          curl -fsSL -o dl/official.tar.gz.sig "$STATIC_SDK_URL.sig"
          echo "$STATIC_SDK_SHA256  dl/official.tar.gz" | sha256sum -c -
          gpg --batch --import keys/swift-all-keys.asc || echo "gpg import exit $? (expected with expired keys)"
          gpg --batch --verify dl/official.tar.gz.sig dl/official.tar.gz
          tar xzf dl/official.tar.gz -C sdk
          rm -rf dl
          ls sdk
      - name: Build libdispatch.a and libFoundation.a (symbols must equal the official bundle's)
        run: |
          set -euo pipefail
          sdkdir=$(echo sdk/*.artifactbundle/*/swift-linux-musl)
          docker run --rm -v "$PWD:/w" -w /w "$BASE_IMAGE" bash overlays/static-sdk/build.sh ${{ matrix.arch }} "/w/$sdkdir" /w/src/libdispatch /w/src/foundation /w/src/deps /w/out 2>&1 | tee build-static-sdk.log | grep -vE 'warning|^ *[0-9]+ \||^ *[|`]|^$|^\[[0-9]+/[0-9]+\]' | tail -60
      - name: Summary
        if: always()
        run: |
          { echo "### static SDK ${{ matrix.arch }}"; echo '```'; cat out/MANIFEST-static-sdk-*.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: static-sdk-built-${{ matrix.arch }}
          path: out/
          retention-days: 3

  static-sdk-bundle:
    needs: [meta, static-sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Load manifest
        run: scripts/load-manifest.sh "${{ needs.meta.outputs.id }}"
      - uses: actions/download-artifact@v8
        with:
          pattern: static-sdk-built-*
          merge-multiple: true
          path: built
      - name: Official bundle (checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o official.tar.gz "$STATIC_SDK_URL"
          echo "$STATIC_SDK_SHA256  official.tar.gz" | sha256sum -c -
      - name: Assemble the patched bundle
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w "$BASE_IMAGE" bash overlays/static-sdk/assemble.sh /w/official.tar.gz /w/built /w/dist "$RELEASE_ID" "$STATIC_SDK_VERSION" \
            "libdispatch ${LIBDISPATCH_REPO}@${LIBDISPATCH_REF}" "foundation ${FOUNDATION_REPO}@${FOUNDATION_REF}" \
            "swift-foundation ${SWIFT_FOUNDATION_TAG}, swift-foundation-icu ${SWIFT_FOUNDATION_ICU_TAG}, swift-collections ${SWIFT_COLLECTIONS_TAG}"
          { echo "### static SDK bundle"; echo '```'; cat dist/MANIFEST-static-sdk.txt; echo "checksum: $(cat dist/*.checksum)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: static-sdk-bundle
          path: dist/
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: static-sdk-official
          path: official.tar.gz
          retention-days: 1
          compression-level: 0

  static-sdk-test:
    needs: [meta, static-sdk-bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Load manifest
        run: scripts/load-manifest.sh "${{ needs.meta.outputs.id }}"
      - uses: actions/download-artifact@v8
        with:
          name: static-sdk-bundle
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: static-sdk-official
          path: official
      - name: Build the reproducers statically against the official and the patched SDK
        run: docker run --rm -v "$PWD:/w" -w /w "$BASE_IMAGE" bash tests/static-sdk/build-repros.sh /w/official/official.tar.gz /w/dist/swift-${RELEASE_ID}_static-linux-${STATIC_SDK_VERSION}.artifactbundle.tar.gz ${{ matrix.arch }} /w/repro-bin
      - name: Run them in a plain container (no Swift installed)
        run: docker run --rm -v "$PWD/repro-bin:/b:ro" -v "$PWD/tests/static-sdk:/t:ro" ubuntu:24.04 bash /t/run-repros.sh /b 8 | tee test-static-sdk.log
      - name: Summary
        if: always()
        run: |
          { echo "### static SDK reproducers ${{ matrix.arch }}"; echo '```'; grep -hE '^(sc000|SUMMARY)' test-static-sdk.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Compiler overlay (SC-0004): swift-frontend rebuilt from the patched swift tree and the swift-6.4.0-RELEASE
  # LLVM/Clang trees inside the official image, then swapped into the official toolchain. Two chained jobs per arch
  # because the LLVM/Clang libraries alone take more than half the 6 h job cap on a 4-core runner; the build tree of the
  # first stage (objects removed) travels as a 1-day artifact.
  compiler-llvm:
    needs: meta
    if: needs.meta.outputs.compiler != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
      - name: Load manifest
        run: scripts/load-manifest.sh "${{ needs.meta.outputs.id }}"
      # The LLVM/Clang stage depends only on the upstream tag and the build script, not on the swift fix, so its
      # packed output (~0.1 GB per arch) is cached under <component>-<tag>-<arch>-<hash> (docs: RETENTION).
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: llvm-stage.tar.zst
          key: compiler-llvm-${{ env.SWIFT_UPSTREAM_TAG }}-${{ matrix.arch }}-${{ hashFiles('overlays/swift-frontend/build.sh') }}
      - name: Free disk
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift
          df -h / | tail -1
      - name: Fetch sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: overlays/swift-frontend/fetch.sh "$PWD/ws" "$SWIFT_REPO" "$SWIFT_REF" "$SWIFT_UPSTREAM_TAG"
      - name: Build LLVM and Clang libraries
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          start=$(date +%s)
          docker run --rm -v "$PWD:/w" -w /w "$BASE_IMAGE" bash overlays/swift-frontend/build.sh llvm /w/ws /w/build /w/out 2>&1 | tee build-llvm.log | grep -E '^\[[0-9]+/[0-9]+\]|^llvm stage|error' | awk 'NR%200==1 || /error/' | tail -150
          echo "llvm stage seconds: $(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          df -h / | tail -1
      - name: Pack the LLVM build tree (no object files)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo chown -R "$USER" build
          tar -C build -cf - --exclude='*.o' --exclude='*.o.d' --exclude='.ninja_*' llvm cmark | zstd -T0 -3 -o llvm-stage.tar.zst
          ls -la llvm-stage.tar.zst | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: llvm-stage.tar.zst
          key: compiler-llvm-${{ env.SWIFT_UPSTREAM_TAG }}-${{ matrix.arch }}-${{ hashFiles('overlays/swift-frontend/build.sh') }}
      - uses: actions/upload-artifact@v7
        with:
          name: compiler-llvm-${{ matrix.arch }}
          path: llvm-stage.tar.zst
          retention-days: 1
          compression-level: 0

  compiler-swift:
    needs: [meta, compiler-llvm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
      - name: Load manifest
        run: scripts/load-manifest.sh "${{ needs.meta.outputs.id }}"
      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift
          df -h / | tail -1
      - name: Fetch sources
        run: overlays/swift-frontend/fetch.sh "$PWD/ws" "$SWIFT_REPO" "$SWIFT_REF" "$SWIFT_UPSTREAM_TAG"
      - uses: actions/download-artifact@v8
        with:
          name: compiler-llvm-${{ matrix.arch }}
          path: stage
      - name: Unpack the LLVM build tree
        run: |
          set -euo pipefail
          mkdir build
          zstd -dc stage/llvm-stage.tar.zst | tar -C build -xf -
          rm -rf stage
          df -h / | tail -1
      - name: Build swift-frontend
        run: |
          start=$(date +%s)
          docker run --rm -v "$PWD:/w" -w /w "$BASE_IMAGE" bash overlays/swift-frontend/build.sh swift /w/ws /w/build /w/out 2>&1 | tee build-swift.log | grep -E '^\[[0-9]+/[0-9]+\]|error|^(component|swift|llvm-project|cmark|version|size|NEEDED|arch|host)|usr/bin' | awk 'NR%100==1 || !/^\[/' | tail -150
          echo "swift stage seconds: $(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          test -x out/usr/bin/swift-frontend
      - uses: actions/upload-artifact@v7
        with:
          name: compiler-${{ matrix.arch }}
          path: out/
          retention-days: 3
          compression-level: 6

  compiler-test:
    needs: [meta, compiler-swift]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Load manifest
        run: scripts/load-manifest.sh "${{ needs.meta.outputs.id }}"
      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.arch }}
          path: compiler
      - name: Test the swapped frontend (reproducers stock vs patched, SwiftPM smoke)
        run: docker run --rm -v "$PWD:/w" -w /w "$BASE_IMAGE" bash tests/SC-0004-field-offset/run.sh /w/compiler | tee test-compiler.log
      - name: Test the swapped frontend (SC-0006 / SC-0019 #isolation in nonisolated(nonsending) code)
        run: docker run --rm -v "$PWD:/w" -w /w "$BASE_IMAGE" bash tests/SC-0006-isolation-macro/run.sh /w/compiler | tee test-isolation.log
      - name: Test the swapped frontend (SC-0005 typed-throws closure in a generic untyped-throws parameter)
        run: docker run --rm -v "$PWD:/w" -w /w "$BASE_IMAGE" bash tests/SC-0005-typed-throws-closure/run.sh /w/compiler | tee test-typed-throws.log
      - name: Test the swapped frontend (SC-0003 async coercion temporary lifetime, swiftlang/swift#91312)
        run: docker run --rm -v "$PWD:/w" -w /w "$BASE_IMAGE" bash tests/SC-0003-coercion-lifetime/run.sh /w/compiler | tee test-coercion-lifetime.log
      - name: Test the swapped frontend (SC-0022 typed-throws closure at an opaque abstraction pattern)
        run: docker run --rm -v "$PWD:/w" -w /w "$BASE_IMAGE" bash tests/SC-0022-typed-throws-closure-opaque/run.sh /w/compiler | tee test-typed-throws-opaque.log
      - name: Summary
        if: always()
        run: |
          { echo "### compiler ${{ matrix.arch }}"; echo '```'; cat compiler/MANIFEST-*.txt 2>/dev/null; grep -hE '^(stock|patched|swift build|SUMMARY)' test-compiler.log test-isolation.log test-typed-throws.log test-coercion-lifetime.log test-typed-throws-opaque.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  package:
    needs: [meta, build, compiler-test]
    # compiler-test is skipped for releases without SWIFT_REF; a skipped need must not skip the package.
    if: ${{ !failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.publish }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04,     dlpath: ubuntu2404,         suffix: ubuntu24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm, dlpath: ubuntu2404-aarch64, suffix: ubuntu24.04-aarch64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Load manifest
        run: scripts/load-manifest.sh "${{ needs.meta.outputs.id }}"
      - uses: actions/download-artifact@v8
        with:
          name: overlay-${{ matrix.arch }}
          path: overlay
      - uses: actions/download-artifact@v8
        if: needs.meta.outputs.compiler != ''
        with:
          name: compiler-${{ matrix.arch }}
          path: overlay
      # actions/upload-artifact does not keep file modes: without this the overlay ships a 0644 swift-frontend
      # (hyp3r.7 did; the driver then spins on EACCES and `swift --version` never returns).
      - name: Restore executable bits
        run: |
          set -euo pipefail
          [ ! -d overlay/usr/bin ] || chmod 0755 overlay/usr/bin/*
          find overlay/usr/bin -type f ! -perm -0111 2>/dev/null | { ! grep .; }
      - name: Official toolchain (signature-verified) + overlay
        run: |
          set -euo pipefail
          base="swift-${SWIFT_VERSION}-RELEASE-${{ matrix.suffix }}"
          url="https://download.swift.org/swift-${SWIFT_VERSION}-release/${{ matrix.dlpath }}/swift-${SWIFT_VERSION}-RELEASE/$base.tar.gz"
          curl -fsSL -o "$base.tar.gz" "$url"
          curl -fsSL -o "$base.tar.gz.sig" "$url.sig"
          # gpg --import exits 2 when any key in the bundle is expired/revoked; the --verify below is the real check.
          # Vendored key bundle (keys/swift-all-keys.asc from https://www.swift.org/keys/all-keys.asc): the live
          # URL serves gzip-encoded bytes even without Accept-Encoding, which gpg rejects.
          gpg --batch --import keys/swift-all-keys.asc || echo "gpg import exit $? (expected with expired keys)"
          gpg --batch --verify "$base.tar.gz.sig" "$base.tar.gz"
          tar xzf "$base.tar.gz"
          cp -a overlay/usr/. "$base/usr/"
          # Gate: the assembled toolchain's frontend and driver must run.
          timeout 60 "$base/usr/bin/swift-frontend" -frontend -version
          timeout 60 "$base/usr/bin/swift-driver" --driver-mode=swiftc --version
          name="swift-${RELEASE_ID}-${{ matrix.suffix }}"
          mv "$base" "$name"
          cp overlay/MANIFEST-*.txt "$name/"
          mkdir -p dist
          tar czf "dist/$name.tar.gz" "$name"
          tar czf "dist/swift-${RELEASE_ID}-overlay-${{ matrix.suffix }}.tar.gz" -C overlay usr $(cd overlay && ls MANIFEST-*.txt)
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: dist/
          retention-days: 3
          compression-level: 0

  image:
    needs: [meta, build, compiler-test]
    if: ${{ !failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.publish }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04,     platform: linux/amd64 }
          - { arch: aarch64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Load manifest
        run: scripts/load-manifest.sh "${{ needs.meta.outputs.id }}"
      - uses: actions/download-artifact@v8
        with:
          name: overlay-${{ matrix.arch }}
          path: overlay
      - uses: actions/download-artifact@v8
        if: needs.meta.outputs.compiler != ''
        with:
          name: compiler-${{ matrix.arch }}
          path: overlay
      # actions/upload-artifact does not keep file modes: without this the overlay ships a 0644 swift-frontend
      # (hyp3r.7 did; the driver then spins on EACCES and `swift --version` never returns).
      - name: Restore executable bits
        run: |
          set -euo pipefail
          [ ! -d overlay/usr/bin ] || chmod 0755 overlay/usr/bin/*
          find overlay/usr/bin -type f ! -perm -0111 2>/dev/null | { ! grep .; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push by digest
        run: |
          set -euo pipefail
          mkdir -p digests
          for v in full slim; do
            if [ $v = full ]; then base="$BASE_IMAGE"; df=docker/Dockerfile; else base="$BASE_IMAGE_SLIM"; df=docker/Dockerfile.slim; fi
            docker buildx build --platform ${{ matrix.platform }} -f $df --build-arg BASE="$base" \
              --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
              --label org.opencontainers.image.description="Swift ${SWIFT_VERSION} with backported fixes (${RELEASE_ID})" \
              --label org.opencontainers.image.version="${RELEASE_ID}" \
              --label dev.hyp3r.swift.base="$base" \
              --metadata-file meta-$v.json \
              --output type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true .
            jq -r '."containerimage.digest"' meta-$v.json > digests/$v-${{ matrix.arch }}
          done
          # Gate: the pushed (still untagged) full image must run the driver and build and run a program.
          docker run --rm "${IMAGE}@$(cat digests/full-${{ matrix.arch }})" bash -c \
            'set -e; timeout 60 swift --version; echo "print(\"hello \\(6 * 7)\")" > /tmp/h.swift; timeout 600 swiftc -O /tmp/h.swift -o /tmp/h; /tmp/h | grep -qx "hello 42"; echo image smoke ok'
          docker run --rm "${IMAGE}@$(cat digests/slim-${{ matrix.arch }})" bash -c 'ls /usr/lib/swift/linux/libdispatch.so >/dev/null && echo slim smoke ok'
          cat digests/*
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: digests/
          retention-days: 1

  publish:
    needs: [meta, package, image, static-sdk-test]
    # static-sdk-test is skipped for releases without STATIC_SDK_VERSION; a skipped need must not skip the publish.
    if: ${{ !failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Load manifest
        run: scripts/load-manifest.sh "${{ needs.meta.outputs.id }}"
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        if: needs.meta.outputs.static != ''
        with:
          name: static-sdk-bundle
          path: dist-sdk
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Multi-arch manifests
        run: |
          set -euo pipefail
          for v in full slim; do
            sfx=""; [ $v = slim ] && sfx="-slim"
            docker buildx imagetools create \
              -t "${IMAGE}:${RELEASE_ID}-noble${sfx}" \
              -t "${IMAGE}:${SWIFT_VERSION}-noble${sfx}" \
              "${IMAGE}@$(cat digests/$v-x86_64)" "${IMAGE}@$(cat digests/$v-aarch64)"
            docker buildx imagetools inspect "${IMAGE}:${RELEASE_ID}-noble${sfx}"
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          sdk_files=()
          if [ -n "${STATIC_SDK_VERSION:-}" ]; then
            sdk_files=(dist-sdk/*.artifactbundle.tar.gz dist-sdk/*.checksum dist-sdk/MANIFEST-static-sdk.txt)
            sdk_name=$(basename dist-sdk/*.artifactbundle.tar.gz)
            sdk_note="
          **Static Linux SDK (musl)**: \`${sdk_name}\`, the official ${SWIFT_VERSION} SDK with libdispatch.a and libFoundation.a rebuilt from the fixes (for \`--swift-sdk\` builds). Checksum: \`$(cat dist-sdk/*.checksum)\`.
          \`swift sdk install https://github.com/${{ github.repository }}/releases/download/swift-${RELEASE_ID}/${sdk_name} --checksum $(cat dist-sdk/*.checksum)\`
          "
          fi
          cat > notes.md <<EOF
          Swift ${SWIFT_VERSION} (official release) with backported fixes. Linux only for this release.

          **Fixes**
          - ${FIXES}

          **Docker** (drop-in for \`swift:${SWIFT_VERSION}-noble\` / \`-noble-slim\`, amd64 + arm64)
          - \`${IMAGE}:${RELEASE_ID}-noble\`, \`${IMAGE}:${RELEASE_ID}-noble-slim\`
          - moving tags: \`${IMAGE}:${SWIFT_VERSION}-noble\`, \`${IMAGE}:${SWIFT_VERSION}-noble-slim\`

          **Tarballs**
          - \`swift-${RELEASE_ID}-ubuntu24.04[-aarch64].tar.gz\`: full official toolchain (signature-verified) with the patched libraries.
          - \`swift-${RELEASE_ID}-overlay-*.tar.gz\`: only the patched files; extract over an existing ${SWIFT_VERSION} install root (\`tar xzf ... -C /\` for /usr installs).

          Statically linked binaries (\`--static-swift-stdlib\`) must be rebuilt to pick up fixes in static libraries.
          ${sdk_note:-}
          Source: ${LIBDISPATCH_REPO:+libdispatch ${LIBDISPATCH_REPO}@${LIBDISPATCH_REF}} ${FOUNDATION_REPO:+foundation ${FOUNDATION_REPO}@${FOUNDATION_REF}}
          EOF
          gh release create "swift-${RELEASE_ID}" dist/*.tar.gz dist/SHA256SUMS "${sdk_files[@]}" \
            -R "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Swift ${RELEASE_ID}" --notes-file notes.md

  mirror:
    needs: [meta, publish]
    uses: ./.github/workflows/mirror.yml
    with:
      release: ${{ needs.meta.outputs.id }}
    secrets: inherit   # needed so the called job can read the publish environment's secrets
